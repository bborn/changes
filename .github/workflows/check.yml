name: Check source-only app
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          if git ls-files | grep -E '^(tunes/[^.]|\.local/|scripts/vendor/|data/melody-sources\.json|dist/)|\.(mxl|musicxml|mid|midi|pdf|zip|gz)$'; then
            echo 'Song data or source archives must not be committed.'
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
